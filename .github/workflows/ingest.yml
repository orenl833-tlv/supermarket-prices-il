name: Daily ingest

# Loads the newest price files into the production database every morning.
# 03:40 UTC is 05:40 in Israeli winter and 06:40 in summer: after the chains
# publish their full price files overnight. Scheduled runs use the default branch.
#
# GitHub starts scheduled runs late when it is busy (on 17.11 the 03:40 run
# started at 12:27), so the run is attempted every hour through the morning.
# Runs are idempotent: the first one to start loads the new files, and the
# later ones skip everything in about a minute. They also act as retries for
# a portal that was down. Actions minutes are free for public repositories.
on:
  schedule:
    - cron: "40 3-10 * * *"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # open or close the "Daily ingest failing" issue
  actions: write # keep this scheduled workflow enabled

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: Daily ingest failing
      SITE_URL: https://supermarket-prices-il.onrender.com
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set; nothing to do."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-node@v5
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.config.outputs.enabled == 'true'
      - name: Ingest (migrations, prices, geocoding)
        if: steps.config.outputs.enabled == 'true'
        run: npm run ingest -w @spil/pipeline

      # Wake the free Render instance so the first visitor of the day does not
      # wait for a cold start. Never fails the run.
      - name: Warm up the site
        if: always() && steps.config.outputs.enabled == 'true'
        run: |
          curl -fsS --max-time 90 "$SITE_URL/api/status" > /dev/null || echo "site did not answer"
          curl -fsS --max-time 90 "$SITE_URL/api/deals" > /dev/null || echo "deals did not answer"

      # GitHub disables scheduled workflows after 60 days without commits.
      # Re-enabling it on every run keeps the daily schedule alive indefinitely.
      - name: Keep the schedule enabled
        if: always()
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/ingest.yml/enable" || true

      # A failure opens one issue (GitHub emails the owner); later failures add
      # a comment to it; the next good run closes it.
      - name: Report failure
        if: failure()
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          NUMBER=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" \
              --body "The daily ingest failed: $RUN_URL. The run log names the chain or branch. This issue closes itself after the next good run."
          fi
      - name: Close the failure issue
        if: success() && steps.config.outputs.enabled == 'true'
        run: |
          NUMBER=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" -R "$GITHUB_REPOSITORY" --comment "Recovered: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
